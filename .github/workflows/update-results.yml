# Refreshes data/results.json from Google Analytics every hour.
# Does nothing until the GA_PROPERTY_ID and GA_SA_KEY secrets are added (see README).
name: Update quiz results

on:
  schedule:
    - cron: "17 * * * *"      # hourly, at :17
  workflow_dispatch: {}        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-analytics-data==0.18.* google-auth
      - name: Fetch counts from GA
        env:
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
          GA_SA_KEY: ${{ secrets.GA_SA_KEY }}
          GA_START_DATE: ${{ vars.GA_START_DATE }}
        run: python scripts/fetch_results.py
      - name: Commit if changed
        run: |
          if git diff --quiet data/results.json; then echo "No change"; exit 0; fi
          git config user.name "results-bot"
          git config user.email "results-bot@users.noreply.github.com"
          git add data/results.json
          git commit -m "Update quiz results"
          git push
